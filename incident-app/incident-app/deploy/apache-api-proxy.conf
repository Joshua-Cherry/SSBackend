# Paste inside <VirtualHost *:443> in /etc/httpd/conf.d/incident-app-le-ssl.conf,
# below the ServerName line. Then: sudo apachectl configtest && sudo systemctl reload httpd

DocumentRoot /var/www/html

ProxyPreserveHost On
ProxyPass        /api/ http://127.0.0.1:3000/api/
ProxyPassReverse /api/ http://127.0.0.1:3000/api/
RequestHeader set X-Forwarded-Proto "https"

Header always set Strict-Transport-Security "max-age=31536000"
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "no-referrer"
Header always set Content-Security-Policy "default-src 'self'; frame-ancestors 'none'"
