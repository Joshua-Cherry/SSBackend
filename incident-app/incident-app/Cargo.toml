[package]
name = "incident-app"
version = "0.1.0"
edition = "2021"
description = "Secure Incident-Reporting Application - backend API (CS 5343 final project)"

[dependencies]
# Web framework and HTTP middleware
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower-http = { version = "0.6", features = ["catch-panic", "trace"] }
tokio = { version = "1", features = ["full"] }

# Database (runtime-checked queries with bind parameters; no compile-time DB needed)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "derive"] }

# AWS Secrets Manager (credentials come from the EC2 instance role)
aws-config = "1"
aws-sdk-secretsmanager = "1"

# Password hashing, session tokens
argon2 = { version = "0.5", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# Serialization, time, errors, logging
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# Keep panics as unwinding so CatchPanicLayer can turn them into a 500 response.
panic = "unwind"
